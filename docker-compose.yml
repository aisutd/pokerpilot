services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Only started on demand: docker compose --profile train run --rm trainer
  trainer:
    build: ./pokerpilot_model
    profiles: ["train"]
    volumes:
      # write new models back to the repo
      - ./pokerpilot_model/artifacts:/app/pokerpilot_model/artifacts
