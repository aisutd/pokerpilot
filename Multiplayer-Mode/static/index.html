<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker Pilot Online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&family=Montserrat:wght@400;500;600&family=Jersey+15&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/lobby.css">
  <link rel="stylesheet" href="/static/loading.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/online.css">
</head>
<body>

  <!-- ============================== LOBBY ============================== -->
  <section id="lobby" class="screen">
    <div class="room" aria-hidden="true">
      <div class="glow curtain-left"></div>
      <div class="glow curtain-right"></div>
      <div class="glow lamp-left"></div>
      <div class="glow lamp-right"></div>
      <div class="bokeh"></div>
      <div class="chair chair-left"></div>
      <div class="chair chair-right"></div>
    </div>

    <header class="brand">
      <div class="crest">
        <span class="crest-line left"></span>
        <svg class="crest-spade" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe6a3"/>
              <stop offset=".5" stop-color="#d9a441"/>
              <stop offset="1" stop-color="#9b6b1c"/>
            </linearGradient>
          </defs>
          <path d="M32 4 C 22 18, 6 26, 6 38 C 6 47, 14 52, 21 50 C 25 49, 28 46, 30 43 C 29 50, 26 55, 20 60 L 44 60 C 38 55, 35 50, 34 43 C 36 46, 39 49, 43 50 C 50 52, 58 47, 58 38 C 58 26, 42 18, 32 4 Z" fill="url(#gold)"/>
          <path d="M32 27 L 36 33 L 32 39 L 28 33 Z" fill="#c4161c"/>
        </svg>
        <span class="crest-line right"></span>
      </div>
      <h1 class="wordmark"><span class="poker">Poker</span> <span class="pilot">Pilot</span></h1>
      <p class="tagline">ONLINE <i>&middot;</i> PLAY <i>&middot;</i> TOGETHER</p>
    </header>

    <div class="lobby-table" aria-hidden="true">
      <div class="rail"></div>
      <div class="felt"></div>
      <div class="cupholder left"></div>
      <div class="cupholder right"></div>
    </div>

    <div class="props" aria-hidden="true">
      <div class="chipstacks left">
        <div class="stack red tall"></div>
        <div class="stack red mid"></div>
        <div class="stack red short front"></div>
        <div class="stack black front2"></div>
        <div class="stack black front3"></div>
      </div>
      <div class="cardbox left"></div>
      <div class="chipstacks right">
        <div class="stack red tall"></div>
        <div class="stack red mid"></div>
        <div class="stack black front"></div>
        <div class="stack red front2"></div>
      </div>
      <div class="cardbox right"></div>
    </div>

    <div class="panel" id="join-panel">
      <label class="field">
        <span>Your name</span>
        <input id="player-name" maxlength="16" autocomplete="nickname" placeholder="e.g. Sam">
      </label>
      <div class="panel-cols">
        <section>
          <h2>New room</h2>
          <p>Get a code to share with friends. You can add AI players before starting.</p>
          <button id="create-room" class="gold-btn">Create room</button>
        </section>
        <div class="or"><span>or</span></div>
        <section>
          <h2>Join a room</h2>
          <input id="join-code" class="code-input" maxlength="5" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Room code">
          <button id="join-room" class="gold-btn">Join</button>
        </section>
      </div>
    </div>

    <div class="panel" id="room-panel" hidden>
      <div class="room-head">
        <span class="label">Room code</span>
        <strong id="room-code" class="room-code"></strong>
        <button id="copy-link" class="link-btn">Copy invite link</button>
      </div>
      <p class="share" id="share-text"></p>
      <ol class="room-seats" id="room-seats"></ol>
      <p class="room-waiting" id="room-waiting" hidden></p>
      <div class="room-settings">
        <div class="seg" role="radiogroup" aria-label="Opponents">
          <button data-mode="pvp" role="radio">Players only (PvP)</button>
          <button data-mode="pve" role="radio">Fill seats with AI (PvE)</button>
        </div>
        <div class="seat-stepper" id="room-seat-stepper">
          <span class="label">Seats</span>
          <button data-seats="-1" aria-label="Remove a seat">&minus;</button>
          <strong class="seat-count"></strong>
          <button data-seats="1" aria-label="Add a seat">+</button>
        </div>
        <div class="seg" id="difficulty-seg" role="radiogroup" aria-label="AI difficulty">
          <button data-difficulty="easy" role="radio">Easy</button>
          <button data-difficulty="medium" role="radio">Medium</button>
          <button data-difficulty="hard" role="radio">Hard</button>
        </div>
      </div>
      <div class="room-actions">
        <button id="leave-room" class="link-btn">Leave</button>
        <button id="start-game" class="gold-btn">Start game</button>
        <span id="start-hint" class="hint"></span>
      </div>
    </div>

    <p id="lobby-error" class="lobby-error" hidden></p>
  </section>

  <!-- ============================= LOADING ============================= -->
  <section id="loading" class="screen" hidden aria-live="polite">
    <div class="loading-panel">
      <div class="loader">
        <svg class="rings" viewBox="0 0 640 640" aria-hidden="true">
          <circle cx="320" cy="320" r="308" class="ring faint"/>
          <circle cx="320" cy="320" r="268" class="ring"/>
          <circle cx="320" cy="320" r="228" class="ring faint"/>
          <g class="spin slow">
            <circle cx="320" cy="320" r="268" class="arc" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="25"/>
            <circle cx="320" cy="320" r="268" class="arc" pathLength="100" stroke-dasharray="21 79" stroke-dashoffset="-35"/>
          </g>
          <g class="spin reverse">
            <circle cx="320" cy="320" r="228" class="arc thin" pathLength="100" stroke-dasharray="9 91" stroke-dashoffset="-56"/>
            <circle cx="320" cy="320" r="228" class="arc thin" pathLength="100" stroke-dasharray="11 89" stroke-dashoffset="-2"/>
          </g>
          <g class="nodes">
            <circle cx="320" cy="52" r="5"/>
            <circle cx="588" cy="320" r="5"/>
            <circle cx="320" cy="588" r="5"/>
            <circle cx="52" cy="320" r="5"/>
          </g>
        </svg>
        <div class="ticks" aria-hidden="true"></div>
        <svg class="center-spade" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4 C 22 18, 6 26, 6 38 C 6 47, 14 52, 21 50 C 25 49, 28 46, 30 43 C 29 50, 26 55, 20 60 L 44 60 C 38 55, 35 50, 34 43 C 36 46, 39 49, 43 50 C 50 52, 58 47, 58 38 C 58 26, 42 18, 32 4 Z"/>
        </svg>
        <div class="orbit cards-orbit" aria-hidden="true">
          <div class="orbit-cards">
            <div class="mini-card back-card"><span>A</span><b>&hearts;</b><em>&hearts;</em></div>
            <div class="mini-card front-card"><span>A</span><b>&spades;</b>
              <svg viewBox="0 0 64 64"><defs><linearGradient id="gold-loading" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset=".55" stop-color="#c8922f"/><stop offset="1" stop-color="#8a5f17"/></linearGradient></defs><path d="M32 4 C 22 18, 6 26, 6 38 C 6 47, 14 52, 21 50 C 25 49, 28 46, 30 43 C 29 50, 26 55, 20 60 L 44 60 C 38 55, 35 50, 34 43 C 36 46, 39 49, 43 50 C 50 52, 58 47, 58 38 C 58 26, 42 18, 32 4 Z" fill="url(#gold-loading)"/></svg>
            </div>
          </div>
        </div>
        <div class="orbit chip-orbit" aria-hidden="true"><div class="orbit-chip"></div></div>
      </div>
      <p class="loading-text" id="loading-text">CONNECTING</p>
    </div>
  </section>

  <!-- ============================== GAME =============================== -->
  <section id="game" class="screen" hidden>
    <!-- Laid out like the team's table mock-up (chip_table_images): on wide
         screens the stage has the table art's shape and everything sits on it. -->
    <div class="stage" id="stage">
      <div class="table-area" id="table-area">
        <div class="poker-table"><div class="felt-line"></div></div>
        <div class="table-center">
          <div class="pot-wrap">
            <div class="pot-chips" id="pot-chips" aria-hidden="true"></div>
            <div class="pot" id="pot"></div>
          </div>
          <div class="board" id="board"></div>
        </div>
        <!-- seats and bet chips are rendered by app.js -->
        <div id="seats"></div>
      </div>

      <div class="center-msgs">
        <div class="result-toast" id="result-toast" hidden></div>
        <div class="status" id="status">
          <span class="hand-strength" id="hand-strength"></span>
          <span class="waiting" id="waiting" hidden></span>
          <span class="hand-done" id="hand-done" hidden>
            <span id="next-in"></span>
            <button id="rebuy" class="act next" hidden>Rebuy $200</button>
          </span>
        </div>
        <p id="game-error" class="game-error" hidden></p>
      </div>

      <div class="controls" id="controls">
        <div class="raise-tray" id="raise-tray" hidden>
          <div class="tray-row">
            <input type="range" id="raise-slider" aria-label="Bet size">
            <div class="amount-box">
              <span>$</span>
              <input type="text" id="raise-input" inputmode="decimal" aria-label="Bet amount in dollars">
            </div>
          </div>
          <div class="presets" id="presets">
            <button data-preset="min"></button>
            <button data-preset="0.5"></button>
            <button data-preset="0.75"></button>
            <button data-preset="1"></button>
            <button data-preset="max"></button>
          </div>
        </div>
        <div class="actions" id="actions" hidden>
          <button id="btn-check" class="act">Check</button>
          <button id="btn-fold" class="act">Fold</button>
          <button id="btn-call" class="act"><span id="call-label">Call</span><span id="call-amount" class="amount"></span></button>
          <button id="btn-raise" class="act raise" aria-expanded="false" aria-controls="raise-tray"><span id="raise-label">Bet / Raise</span></button>
        </div>
      </div>

      <nav class="hud" aria-label="Table buttons">
        <button id="chat-toggle" class="hud-btn" aria-expanded="false" aria-controls="chat-widget" aria-label="Table chat" title="Table chat">
          <span class="hud-icon chat-icon">
            <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#ffd34d" d="M2 2h8v1h1v5h-1v1H6L4 11V9H2V8H1V3h1z"/><path fill="#5a0f15" d="M3 4h6v1H3zm0 2h4v1H3z"/></svg>
          </span>
          <span class="hud-label">Chat</span>
        </button>
        <button id="menu-toggle" class="hud-btn" aria-expanded="false" aria-controls="menu-panel">
          <img class="hud-icon" src="/static/art/icon-menu.png" alt=""><span class="hud-label">Menu</span>
        </button>
        <button id="settings-toggle" class="hud-btn" aria-expanded="false" aria-controls="settings-panel">
          <img class="hud-icon" src="/static/art/icon-settings.png" alt=""><span class="hud-label">Settings</span>
        </button>
        <button id="sound-toggle" class="hud-btn" aria-pressed="true">
          <img class="hud-icon" src="/static/art/icon-sound.png" alt=""><span class="hud-label">Sound</span>
        </button>
      </nav>

      <div class="popover" id="menu-panel" hidden>
        <h2>Room <strong id="room-tag"></strong></h2>
        <p class="hand-info"><span id="hand-number"></span> &middot; <span id="street"></span></p>
        <button id="copy-invite" class="pop-btn">Copy invite link</button>
        <button id="history-toggle" class="pop-btn" aria-expanded="false" aria-controls="history">Hand history</button>
        <div class="seat-stepper" id="game-seat-stepper" hidden>
          <span class="label">Seats</span>
          <button data-seats="-1" aria-label="Remove a seat">&minus;</button>
          <strong class="seat-count"></strong>
          <button data-seats="1" aria-label="Add a seat">+</button>
        </div>
        <button id="quit" class="pop-btn leave">Leave room</button>
      </div>

      <div class="popover" id="settings-panel" hidden>
        <h2>Settings</h2>
        <label class="setting"><input type="checkbox" data-setting="sound"> Sound effects</label>
        <label class="setting"><input type="checkbox" data-setting="hint"> Name my hand (e.g. "One pair")</label>
        <label class="setting"><input type="checkbox" data-setting="presets"> Bet size shortcuts</label>
        <label class="setting"><input type="checkbox" data-setting="stats"> Player stats on the plates</label>
      </div>
    </div>

    <aside class="history" id="history" hidden>
      <div class="history-head">
        <h2>Hand history</h2>
        <button id="history-close" class="ghost" aria-label="Close history">&times;</button>
      </div>
      <ol class="log" id="log"></ol>
    </aside>
  </section>

  <!-- ============================ GAME OVER ============================ -->
  <div class="modal" id="game-over" hidden>
    <div class="modal-card">
      <h2 id="game-over-title"></h2>
      <p id="game-over-text"></p>
      <div class="modal-buttons">
        <button id="modal-rebuy" class="act next">Rebuy $200</button>
        <button id="restart" class="act next">Reset everyone's chips</button>
        <button id="to-lobby" class="ghost">Leave room</button>
      </div>
    </div>
  </div>

  <!-- Table chat: the team's chat box (client/) in a draggable window -->
  <aside class="chat-widget" id="chat-widget" hidden aria-label="Multiplayer chat">
    <header class="chat-widget-header" id="chat-drag-handle">
      <span class="chat-player-names" id="chat-player-names">Poker game</span>
      <button id="chat-minimize" type="button" aria-label="Minimize chat" aria-expanded="true">&minus;</button>
    </header>
    <div class="chat-widget-content" id="chat-widget-content">
      <iframe id="chat-frame" title="Multiplayer poker chat" src="about:blank" data-src="/chat/"></iframe>
    </div>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
